name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: swm_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/swm_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare migration test database
        run: npm run db:prepare-test
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Exercise migration runner
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Verify migrated schema
        run: npm run db:verify
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Run unit tests
        run: npm test
        env:
          TEST_DATABASE_URL: ''
      - name: Run collaboration database tests
        run: npm run test:collaboration
      - name: Build
        run: npm run build
        env:
          VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}
          VITE_NEON_DATA_API_URL: ${{ vars.VITE_NEON_DATA_API_URL }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Verify protected API release contract
        if: ${{ vars.VITE_API_BASE_URL != '' }}
        run: npm run release:verify
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          ALLOW_LEGACY_API_HEALTH: 'true'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
