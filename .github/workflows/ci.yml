name: Verify application

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: swm_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/swm_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare migration test database
        run: npm run db:prepare-test
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Exercise migration runner
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Verify migrated schema
        run: npm run db:verify
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Run unit tests
        run: npm test
        env:
          TEST_DATABASE_URL: ''
      - name: Run collaboration database tests
        run: npm run test:collaboration
      - name: Build production application
        run: npm run build
